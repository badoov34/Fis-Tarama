services:
  # PostgreSQL veritabanı
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fis_user
      POSTGRES_PASSWORD: fis_sifre
      POSTGRES_DB: fis_tarama
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fis_user -d fis_tarama"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI + Tesseract OCR)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fis_user:fis_sifre@db:5432/fis_tarama
      JWT_SECRET: buraya-guclu-bir-sifre-yazin-degisin
      HOST: "0.0.0.0"
      PORT: "8000"
      UPLOAD_DIR: /app/uploads
      TESSERACT_LANG: tur
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads

  # Veritabanı Yedekleme (her gün saat 02:00'de otomatik çalışır)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fis_tarama
      DB_USER: fis_user
      DB_PASSWORD: fis_sifre
    volumes:
      - ./backups:/backups
      - ./backend/scripts:/app/scripts:ro
    entrypoint: /bin/sh
    command: -c "chmod +x /app/scripts/backup.sh && echo '0 2 * * * /app/scripts/backup.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root && crond -f -l 2"
    # Manuel yedekleme için:
    # docker compose run --rm backup /app/scripts/backup.sh

  # Manuel yedekleme / geri yükleme (bir kere çalıştırılır)
  backup-run:
    image: postgres:16-alpine
    profiles: ["backup"]  # Sadece manuel çalıştırma
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fis_tarama
      DB_USER: fis_user
      DB_PASSWORD: fis_sifre
    volumes:
      - ./backups:/backups
      - ./backend/scripts:/app/scripts:ro
    entrypoint: /bin/sh
    command: /app/scripts/backup.sh

volumes:
  pgdata:
  uploads:
